name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Mizuki 테마는 pnpm 전용이다 (package.json 의 packageManager).
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          node-version: 22
          package-manager: pnpm@11.5.3
          # 콘텐츠 캐시를 쓰면 rehype 플러그인을 바꿔도 내용이 같은 글은 예전 HTML이 그대로 나간다.
          cache: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
